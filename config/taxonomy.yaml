# Frozen before model evaluation. Changes require a new taxonomy version.
# split: the former queue divides across V2 destinations.
# move: the intent is reassigned to a different operational function.
# unchanged: the queue and its role are retained in V2.
v1:
  CARD_SERVICES:
    description: >
      Requests about obtaining, activating, configuring, replacing or using
      a physical or virtual bank card.
  CARD_PAYMENTS:
    description: >
      Card purchases, payment failures, refunds, charges and payment disputes,
      including the small direct-debit caseload.
  CASH_WITHDRAWAL:
    description: >
      ATM access, cash withdrawals and related problems.
  TRANSFERS:
    description: >
      Sending, receiving and managing bank transfers.
  TOP_UPS:
    description: >
      Adding funds by card, bank transfer, cash or cheque and resolving
      related problems.
  ACCOUNT_ACCESS:
    description: >
      Account eligibility, access, identity checks, personal details
      and account administration.
  CURRENCY:
    description: >
      Currency support, conversion, exchange rates and associated charges.

v2:
  CARD_MANAGEMENT:
    description: >
      Physical or virtual card issuance, activation, PINs and general
      card operation.
  DIGITAL_PAYMENTS:
    description: >
      Card purchases, contactless and mobile payments, payment failures,
      refunds and related charges.
  CASH_WITHDRAWAL:
    description: >
      ATM access, cash withdrawals and related problems.
  TRANSFERS:
    description: >
      Sending, receiving and managing bank transfers.
  TOP_UPS:
    description: >
      Adding funds and resolving problems associated with topping up.
  ACCOUNT_SERVICES:
    description: >
      Account eligibility, access, personal information and administration.
  IDENTITY_COMPLIANCE:
    description: >
      Identity verification, source-of-funds checks and verification
      requirements.
  SECURITY_DISPUTES:
    description: >
      Suspected compromise, lost or stolen access devices and unrecognized
      financial activity.
  CURRENCY:
    description: >
      Currency support, conversion, exchange rates and associated charges.

