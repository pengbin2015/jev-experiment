[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-experiment"
version = "0.1.0"
description = "Taxonomy-guided BANKING77 experiments"
requires-python = ">=3.10"
dependencies = [
  "datasets>=4.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0"]
